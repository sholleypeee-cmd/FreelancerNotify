<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Freelancer Notify</title>

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0b1220;
      font-family: Arial, sans-serif;
      color: white;
    }

    .card {
      width: 90%;
      max-width: 420px;
      padding: 30px;
      text-align: center;
      background: #111b2e;
      border-radius: 20px;
      box-sizing: border-box;
    }

    h1 {
      margin-top: 0;
    }

    p {
      color: #b8c2d1;
    }

    .device {
      margin: 20px 0;
      padding: 15px;
      background: #0f172a;
      border-radius: 10px;
      word-break: break-all;
      font-size: 13px;
      color: #22c55e;
    }

    button {
      width: 100%;
      padding: 14px;
      margin-top: 15px;
      border: 0;
      border-radius: 10px;
      background: #22c55e;
      color: white;
      font-size: 16px;
      font-weight: bold;
    }

    #status {
      margin-top: 20px;
      font-weight: bold;
    }
  </style>
</head>

<body>

  <div class="card">

    <h1>Freelancer Notify</h1>

    <p>Connect this phone to your Chrome device.</p>

    <div class="device" id="deviceInfo">
      Checking device...
    </div>

    <button id="connectButton">
      Connect Device
    </button>

    <div id="status"></div>

  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const deviceId = params.get("device");

    const deviceInfo = document.getElementById("deviceInfo");
    const status = document.getElementById("status");

    if (deviceId) {
      deviceInfo.textContent = "Chrome device detected";
    } else {
      deviceInfo.textContent = "No device QR information found";
    }

    document
      .getElementById("connectButton")
      .addEventListener("click", () => {

        if (!deviceId) {
          status.textContent = "No device was found.";
          return;
        }

        status.textContent = "Device detected. Pairing system ready.";
      });
  </script>

</body>
</html>
