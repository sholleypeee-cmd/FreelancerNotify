<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Freelancer Notify</title>

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0b1220;
      font-family: Arial, sans-serif;
      color: white;
    }

    .card {
      width: 90%;
      max-width: 420px;
      padding: 30px;
      text-align: center;
      background: #111b2e;
      border-radius: 20px;
      box-sizing: border-box;
    }

    h1 {
      margin-top: 0;
    }

    p {
      color: #b8c2d1;
    }

    .device {
      margin: 20px 0;
      padding: 15px;
      background: #0f172a;
      border-radius: 10px;
      word-break: break-all;
      font-size: 13px;
      color: #22c55e;
    }

    button {
      width: 100%;
      padding: 14px;
      margin-top: 15px;
      border: 0;
      border-radius: 10px;
      background: #22c55e;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.6;
    }

    #status {
      margin-top: 20px;
      font-weight: bold;
    }
  </style>
</head>

<body>

  <div class="card">

    <h1>Freelancer Notify</h1>

    <p>Connect this phone to your Chrome device.</p>

    <div class="device" id="deviceInfo">
      Checking device...
    </div>

    <button id="connectButton">
      Connect Device
    </button>

    <div id="status"></div>

  </div>

<script>

const SUPABASE_URL =
  "https://umwztfnsyrbilsuwchik.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_SSIPoJViFPvqXJtHxUkjjw_7JSKnaSq";

const VAPID_PUBLIC_KEY =
  "BD4_cOCLPGjLuHMAHaCYEp9HyDiBKZAy3QKaOHhr_tVdS8qzw_y5sHecNsp2R-KOl5ivICE8Pjx5wyfHeV-7TCw";


const params =
  new URLSearchParams(window.location.search);

const deviceId =
  params.get("device");


const deviceInfo =
  document.getElementById("deviceInfo");

const status =
  document.getElementById("status");

const connectButton =
  document.getElementById("connectButton");


function urlBase64ToUint8Array(base64String) {

  const padding =
    "=".repeat(
      (4 - base64String.length % 4) % 4
    );

  const base64 =
    (base64String + padding)
      .replace(/-/g, "+")
      .replace(/_/g, "/");

  const rawData =
    window.atob(base64);

  return Uint8Array.from(
    [...rawData].map(
      char => char.charCodeAt(0)
    )
  );
}


if (deviceId) {

  deviceInfo.textContent =
    "Chrome device detected";

} else {

  deviceInfo.textContent =
    "No device QR information found";

  connectButton.disabled = true;
}


connectButton.addEventListener(
  "click",
  async () => {

    if (!deviceId) {

      status.textContent =
        "No device was found.";

      return;
    }


    connectButton.disabled = true;

    status.textContent =
      "Requesting notification permission...";


    try {

      const permission =
        await Notification.requestPermission();


      if (permission !== "granted") {

        status.textContent =
          "Notification permission was not granted.";

        connectButton.disabled = false;

        return;
      }


      status.textContent =
        "Registering notification service...";


      const registration =
        await navigator.serviceWorker.register(
          "/sw.js"
        );


      await navigator.serviceWorker.ready;


      status.textContent =
        "Creating phone notification subscription...";


      const subscription =
        await registration.pushManager.subscribe({

          userVisibleOnly: true,

          applicationServerKey:
            urlBase64ToUint8Array(
              VAPID_PUBLIC_KEY
            )

        });


      const subscriptionJson =
        subscription.toJSON();


      let phoneId =
        localStorage.getItem(
          "freelancerNotifyPhoneId"
        );


      if (!phoneId) {

        phoneId =
          crypto.randomUUID();

        localStorage.setItem(
          "freelancerNotifyPhoneId",
          phoneId
        );
      }


      status.textContent =
        "Saving phone connection...";


      const response =
        await fetch(
          `${SUPABASE_URL}/rest/v1/phone_devices?on_conflict=phone_id`,
          {
            method: "POST",

            headers: {

              "Content-Type":
                "application/json",

              "apikey":
                SUPABASE_KEY,

              "Prefer":
                "resolution=merge-duplicates,return=minimal"

            },

            body: JSON.stringify({

              device_id:
                deviceId,

              phone_id:
                phoneId,

              status:
                "connected",

              push_endpoint:
                subscriptionJson.endpoint,

              push_p256dh:
                subscriptionJson.keys.p256dh,

              push_auth:
                subscriptionJson.keys.auth,

              last_seen:
                new Date().toISOString(),

              notification_enabled:
                true

            })
          }
        );


      if (!response.ok) {

        const errorText =
          await response.text();

        console.error(
          "Supabase error:",
          response.status,
          errorText
        );

        status.textContent =
          "Pairing failed: " +
          response.status;

        connectButton.disabled = false;

        return;
      }


      status.textContent =
        "✅ Phone notifications enabled!";

      connectButton.textContent =
        "Connected";


    } catch (error) {

      console.error(
        "Connection error:",
        error
      );

      status.textContent =
        "Error: " +
        error.message;

      connectButton.disabled = false;

    }

  }
);

</script>

</body>
</html>
