<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Freelancer Notify</title>

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0b1220;
      font-family: Arial, sans-serif;
      color: white;
    }

    .card {
      width: 90%;
      max-width: 420px;
      padding: 30px;
      text-align: center;
      background: #111b2e;
      border-radius: 20px;
      box-sizing: border-box;
    }

    h1 {
      margin-top: 0;
    }

    p {
      color: #b8c2d1;
    }

    input {
      width: 100%;
      box-sizing: border-box;
      padding: 14px;
      margin-top: 15px;
      border-radius: 10px;
      border: 1px solid #334155;
      background: #0f172a;
      color: white;
      font-size: 16px;
    }

    button {
      width: 100%;
      padding: 14px;
      margin-top: 15px;
      border: 0;
      border-radius: 10px;
      background: #22c55e;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    #status {
      margin-top: 20px;
      font-weight: bold;
    }
  </style>
</head>

<body>

  <div class="card">

    <h1>Freelancer Notify</h1>

    <p>Connect your phone to a Chrome device.</p>

    <input
      id="pairingCode"
      type="text"
      placeholder="Enter pairing code"
    >

    <button id="connectButton">
      Connect Device
    </button>

    <div id="status"></div>

  </div>

  <script>
    document
      .getElementById("connectButton")
      .addEventListener("click", () => {

        const code =
          document.getElementById("pairingCode").value.trim();

        const status =
          document.getElementById("status");

        if (!code) {
          status.textContent = "Please enter a pairing code.";
          return;
        }

        status.textContent =
          "Pairing system ready for: " + code;
      });
  </script>

</body>
</html>
