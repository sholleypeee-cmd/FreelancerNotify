<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Freelancer Notify</title>

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0b1220;
      font-family: Arial, sans-serif;
      color: white;
    }

    .card {
      width: 90%;
      max-width: 420px;
      padding: 30px;
      text-align: center;
      background: #111b2e;
      border-radius: 20px;
      box-sizing: border-box;
    }

    h1 {
      margin-top: 0;
    }

    p {
      color: #b8c2d1;
    }

    .device {
      margin: 20px 0;
      padding: 15px;
      background: #0f172a;
      border-radius: 10px;
      word-break: break-all;
      font-size: 13px;
      color: #22c55e;
    }

    button {
      width: 100%;
      padding: 14px;
      margin-top: 15px;
      border: 0;
      border-radius: 10px;
      background: #22c55e;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.6;
    }

    #status {
      margin-top: 20px;
      font-weight: bold;
    }
  </style>
</head>

<body>

  <div class="card">

    <h1>Freelancer Notify</h1>

    <p>Connect this phone to your Chrome device.</p>

    <div class="device" id="deviceInfo">
      Checking device...
    </div>

    <button id="connectButton">
      Connect Device
    </button>

    <div id="status"></div>

  </div>

  <script>
    const SUPABASE_URL = "https://umwztfnsyrbilsuwchik.supabase.co/rest/v1/";
    const SUPABASE_KEY = "sb_publishable_SSIPoJViFPvqXJtHxUkjjw_7JSKnaSq";

    const params = new URLSearchParams(window.location.search);
    const deviceId = params.get("device");

    const deviceInfo = document.getElementById("deviceInfo");
    const status = document.getElementById("status");
    const connectButton = document.getElementById("connectButton");

    function getBaseUrl() {
      return SUPABASE_URL
        .replace(/\/rest\/v1\/?$/, "")
        .replace(/\/$/, "");
    }

    if (deviceId) {
      deviceInfo.textContent = "Chrome device detected";
    } else {
      deviceInfo.textContent = "No device QR information found";
      connectButton.disabled = true;
    }

    connectButton.addEventListener("click", async () => {

      if (!deviceId) {
        status.textContent = "No device was found.";
        return;
      }

      connectButton.disabled = true;
      status.textContent = "Connecting...";

      const phoneId =
        localStorage.getItem("freelancerNotifyPhoneId") ||
        crypto.randomUUID();

      localStorage.setItem(
        "freelancerNotifyPhoneId",
        phoneId
      );

      try {

        const response = await fetch(
          `${getBaseUrl()}/rest/v1/phone_devices`,
          {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              "apikey": SUPABASE_KEY,
              "Authorization": `Bearer ${SUPABASE_KEY}`,
              "Prefer": "return=minimal"
            },
            body: JSON.stringify({
              device_id: deviceId,
              phone_id: phoneId,
              status: "connected"
            })
          }
        );

        if (!response.ok) {
          const errorText = await response.text();

          status.textContent =
            "Pairing failed: " +
            response.status;

          console.log(errorText);
          connectButton.disabled = false;
          return;
        }

        status.textContent =
          "✅ Device connected successfully!";

        connectButton.textContent = "Connected";

      } catch (error) {

        status.textContent =
          "Connection error.";

        console.log(error);

        connectButton.disabled = false;
      }
    });
  </script>

</body>
</html>
